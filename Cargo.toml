[package]
name = "riscv_emu"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
eframe = "0.34.1"
egui_extras = "0.34.1"
rfd = "0.17.2"
emulator = { path = "./emulator", features = ["semihosting"] }

[workspace]
members = ["emulator"]
resolver = "2"

[profile.release]
debug = true